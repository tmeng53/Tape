name: CI

on:
  pull_request:
  push:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: No code comments
        run: ./scripts/check-no-comments.sh
      - name: Core tests
        run: swift test --package-path Packages/TapeKit
      - name: Build app
        run: xcodebuild -project Tape.xcodeproj -scheme Tape -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
